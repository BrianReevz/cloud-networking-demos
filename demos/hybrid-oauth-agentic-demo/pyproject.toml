[project]
name = "hybrid-oauth-agentic-demo"
version = "1.0.0"
description = "Multi-Agent Hybrid OAuth (2-Legged Sentinel & 3-Legged Copilot) Demo Environment for Gemini Enterprise"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "fastmcp>=2.0.0",
    "starlette>=0.41.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
